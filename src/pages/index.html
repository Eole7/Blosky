<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Blosky</title>
        <link rel="stylesheet" href="style.css">
        <script src="index_background/three.js"></script>
        <script src="index_background/vanta_waves.js"></script>
    </head>
    

    
    <body id=background>
        <h1>Blosky</h1>
        <div id=projects>
            <div id=open_menu>
                <img src="../../resources/open_project.png">
                <button onclick="window.bloskyAPI.openProject().then(result => { if(!result.canceled) { window.location.replace('plugin_config.html'); } })">Open project</button>
            </div>
            <div id=create_menu>
                <img src="../../resources/create_project.png">
                <a href="plugin_config.html">
                    <button>Create new project</button>
                </a>
            </div>
        </div>
    </body>
    
    <script>
        window.bloskyAPI.clearStorage()
        VANTA.WAVES({
            el: "body",
            mouseControls: false,
            touchControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0x19252d,
            shininess: 5.00,
            waveHeight: 3.00,
            waveSpeed: 0.90,
            zoom: 0.95
        })
    </script>
</html>
