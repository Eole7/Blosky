<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <title>Blosky</title>
        <link rel="stylesheet" href="style.css">
    </head>
    

    
    <body>
        <nav class="sidenav">
            <a href="index.html">Switch project</a>
            <a href="plugin_config.html">Plugin config</a>
            <a href="workspace.html">Workspace</a>
            <a class="active">Save & Export</a>
        </nav>
        <div id="main">
            <button id="save_button">Save</button>
            <button id="save_as_button">Save as</button>
            <!--
                <div id="autosavediv">
                    <label for="autosave">Auto save</label>
                    <input type="checkbox" id="autosave">
                    
                </div>
            -->
            <button id="export_button">Export to Spigot Plugin</button>
        </div>
    </body>
    
    <script>
        async function getProjectSettings() {
            return {
                name: await window.bloskyAPI.getSetting("name"),
                version: await window.bloskyAPI.getSetting("version"),
                author: await window.bloskyAPI.getSetting("author"),
                description: await window.bloskyAPI.getSetting("description")
            }
        }

        async function doSave() {
            const project = JSON.stringify(await getProjectSettings()) + '\r' + await window.bloskyAPI.getCode()
            const path = await window.bloskyAPI.getPath()
            await window.bloskyAPI.saveProject(project, path)
        }

        async function doSaveAs() {
            const project = JSON.stringify(await getProjectSettings()) + '\r' + await window.bloskyAPI.getCode()
            await window.bloskyAPI.saveProjectAs(project)
        }

        async function doExport() {
            const settings = await getProjectSettings()
            const code = await window.bloskyAPI.getCode()
            const result = await window.bloskyAPI.exportProject(code, settings)
            if(result.success) {
                alert(settings.name + ' was successfully compiled to ' + result.path + '.jar')
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('save_button').addEventListener('click', doSave)
            document.getElementById('save_as_button').addEventListener('click', doSaveAs)
            document.getElementById('export_button').addEventListener('click', doExport)
        })
    </script>
</html>
