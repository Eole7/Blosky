name: Build/release

on: [push, pull_request]

permissions:
  attestations: write
  contents: read
  id-token: write

jobs:
  release:
    runs-on: default

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Read build version and set product name
        run: node .github/scripts/set-build-env.js

      - name: Build Windows artifacts
        uses: samuelmeuli/action-electron-builder@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release: ${{ startsWith(github.ref, 'refs/tags/v') }}
          args: --config.productName="${{ env.BUILD_PRODUCT_NAME }}" --publish never --win

      - name: Find Docker executable
        run: node .github/scripts/find-docker.js

      - name: Build Linux artifacts with Docker
        run: |
          & "${{ env.DOCKER_EXE }}" run --rm `
            -v "${{ github.workspace }}:/app" `
            -w /app `
            -e BUILD_VERSION=${{ env.BUILD_VERSION }} `
            -e BUILD_PRODUCT_NAME="${{ env.BUILD_PRODUCT_NAME }}" `
            electronuserland/builder:latest `
            bash -c "npm install && npm run build -- --linux --config.productName=""$BUILD_PRODUCT_NAME"""

      - name: Stage artifacts for manual retrieval
        run: node .github/scripts/stage-artifacts.js

      - name: List staged artifacts
        run: node -e "const fs=require('fs');const path=require('path');const stage=path.join(process.env.GITHUB_WORKSPACE,'artifacts');if(!fs.existsSync(stage)){console.log('artifacts dir not found');process.exit(0);}for(const f of fs.readdirSync(stage)){const p=path.join(stage,f);const s=fs.statSync(p);console.log(s.size+' '+p);}"

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v4.1.1
        with:
          subject-path: ${{ github.workspace }}/artifacts
          push-to-registry: false
          create-storage-record: true
          show-summary: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
